<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passave</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen active">
        <div class="login-bg">
            <div class="login-orb orb1"></div>
            <div class="login-orb orb2"></div>
        </div>
        <div class="login-content">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M3.043 0.00793814C2.67875 -0.0402392 2.33862 0.144477 2.30044 0.196644C2.26227 0.248811 1.93183 0.521439 2.0029 1.01486V12.004V22.9933L2.14131 23.2435C2.49875 23.8897 3.15581 24.1523 3.81468 23.9125C4.1043 23.8069 16.4213 11.5612 16.6263 11.1749C17.2416 10.0148 15.821 8.72086 14.7127 9.4318C14.2081 9.75558 12.4039 11.9134 12.0039 12.1134C11.9039 12.2134 11.3996 12.6718 11.3996 12.6718C10.8872 13.3827 8.79716 13.8649 7.68345 13.5293C7.19021 13.3805 6.39112 12.9737 6.33212 12.8413C6.32252 12.8193 6.28951 12.8013 6.25911 12.8013C6.1805 12.8013 5.63385 12.2274 5.44343 11.945C5.35542 11.8148 5.27142 11.696 5.25661 11.6814C4.84697 11.2749 4.55855 9.35161 4.80477 8.66826C4.84697 8.55107 4.88198 8.42508 4.88238 8.38849C4.88358 8.28669 5.20061 7.63794 5.38262 7.36496C5.61325 7.01899 5.49044 7.14538 9.1902 3.44207C11.0458 1.58461 12.5639 0.0509344 12.5639 0.0337357C12.5639 0.016537 10.4217 0.00354002 7.80347 0.0051399L3.043 0.00793814ZM11.6988 4.77137C7.32902 9.14203 7.41703 9.04223 7.42383 9.62179C7.43383 10.4673 8.01409 10.9841 8.88357 10.9219C9.37622 10.8865 9.40042 10.8671 11.2548 9.01904C12.1693 8.10751 12.935 7.36177 12.9564 7.36177C12.9776 7.36177 13.047 7.31357 13.1102 7.25458C13.2422 7.13159 14.0659 6.72182 14.1809 6.72182C14.2229 6.72182 14.3617 6.68502 14.4891 6.64002C15.3876 6.32305 17.1946 6.71662 17.9178 7.38696C17.9979 7.46116 18.0733 7.52175 18.0855 7.52175C18.1315 7.52175 18.4845 7.90093 18.4845 7.95012C18.4845 7.97852 18.5051 8.00172 18.5305 8.00172C18.5963 8.00172 18.9845 8.61627 19.1368 8.96164C19.6218 10.0612 19.5426 11.574 18.9487 12.5572C18.6567 13.0407 18.5153 13.1891 15.038 16.665C13.1492 18.5531 11.6038 20.112 11.6038 20.1292C11.6038 20.3588 14.2657 19.9804 15.3586 19.6104C16.2951 19.2934 18.2123 18.2657 18.2123 18.0809C18.3669 18.0809 20.1047 16.3131 20.1301 16.1523C20.2047 16.1131 20.7743 15.255 20.8985 15.0146C22.1461 12.6008 22.4661 10.3453 21.9166 7.84173C21.8222 7.41076 21.5656 6.58163 21.4466 6.32185C21.0689 5.49771 20.7537 4.89376 20.6313 4.76037C20.5947 4.72037 20.5647 4.66757 20.5647 4.64278C20.5647 4.59598 20.0298 3.85984 19.7786 3.56086C19.6026 3.35128 18.8361 2.58634 18.6169 2.40135C18.2677 2.10678 17.796 1.7622 17.7418 1.7622C17.7102 1.7622 17.6842 1.7442 17.684 1.72221C17.6834 1.64421 16.7281 1.11045 16.1445 0.862071L15.7676 0.701884L11.6988 4.77137Z"
                            fill="#928EFE" />
                    </svg>
                </div>
                <span class="brand-name">Passave</span>
            </div>
            <h1 class="login-title">Unlock your<br>vault.</h1>
            <p class="login-sub">Zero-knowledge. Always encrypted.</p>

            <form id="login-form" class="login-form" autocomplete="off">
                <div class="field-group">
                    <div class="field">
                        <label class="field-label">Email</label>
                        <input type="email" id="login-email" class="field-input" placeholder="you@example.com" required
                            autocomplete="off">
                    </div>
                    <div class="field">
                        <label class="field-label">Master Password</label>
                        <div class="field-input-wrap">
                            <input type="password" id="login-password" class="field-input" placeholder="••••••••••••"
                                required autocomplete="new-password">
                            <button type="button" class="reveal-btn" id="reveal-password">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label">2FA Code</label>
                        <input type="text" id="login-otp" class="field-input otp-input" placeholder="6-digit code"
                            maxlength="6" inputmode="numeric" required autocomplete="off">
                    </div>
                </div>

                <div id="login-error" class="error-msg" style="display:none"></div>

                <button type="submit" id="login-btn" class="btn-primary">
                    <span class="btn-text">Unlock Vault</span>
                    <span class="btn-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </span>
                </button>

                <div class="register-prompt">
                    <span class="register-text">New to Passave?</span>
                    <a href="https://passave.org/sign-up" target="_blank" rel="noopener noreferrer"
                        class="register-link">Create a Vault</a>
                </div>

            </form>
        </div>
    </div>

    <!-- VAULT SCREEN -->
    <div id="screen-vault" class="screen">
        <!-- Header -->
        <div class="vault-header">
            <div class="vault-header-left">
                <div class="brand-icon small">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M3.043 0.00793814C2.67875 -0.0402392 2.33862 0.144477 2.30044 0.196644C2.26227 0.248811 1.93183 0.521439 2.0029 1.01486V12.004V22.9933L2.14131 23.2435C2.49875 23.8897 3.15581 24.1523 3.81468 23.9125C4.1043 23.8069 16.4213 11.5612 16.6263 11.1749C17.2416 10.0148 15.821 8.72086 14.7127 9.4318C14.2081 9.75558 12.4039 11.9134 12.0039 12.1134C11.9039 12.2134 11.3996 12.6718 11.3996 12.6718C10.8872 13.3827 8.79716 13.8649 7.68345 13.5293C7.19021 13.3805 6.39112 12.9737 6.33212 12.8413C6.32252 12.8193 6.28951 12.8013 6.25911 12.8013C6.1805 12.8013 5.63385 12.2274 5.44343 11.945C5.35542 11.8148 5.27142 11.696 5.25661 11.6814C4.84697 11.2749 4.55855 9.35161 4.80477 8.66826C4.84697 8.55107 4.88198 8.42508 4.88238 8.38849C4.88358 8.28669 5.20061 7.63794 5.38262 7.36496C5.61325 7.01899 5.49044 7.14538 9.1902 3.44207C11.0458 1.58461 12.5639 0.0509344 12.5639 0.0337357C12.5639 0.016537 10.4217 0.00354002 7.80347 0.0051399L3.043 0.00793814ZM11.6988 4.77137C7.32902 9.14203 7.41703 9.04223 7.42383 9.62179C7.43383 10.4673 8.01409 10.9841 8.88357 10.9219C9.37622 10.8865 9.40042 10.8671 11.2548 9.01904C12.1693 8.10751 12.935 7.36177 12.9564 7.36177C12.9776 7.36177 13.047 7.31357 13.1102 7.25458C13.2422 7.13159 14.0659 6.72182 14.1809 6.72182C14.2229 6.72182 14.3617 6.68502 14.4891 6.64002C15.3876 6.32305 17.1946 6.71662 17.9178 7.38696C17.9979 7.46116 18.0733 7.52175 18.0855 7.52175C18.1315 7.52175 18.4845 7.90093 18.4845 7.95012C18.4845 7.97852 18.5051 8.00172 18.5305 8.00172C18.5963 8.00172 18.9845 8.61627 19.1368 8.96164C19.6218 10.0612 19.5426 11.574 18.9487 12.5572C18.6567 13.0407 18.5153 13.1891 15.038 16.665C13.1492 18.5531 11.6038 20.112 11.6038 20.1292C11.6038 20.3588 14.2657 19.9804 15.3586 19.6104C16.2951 19.2934 18.2123 18.2657 18.2123 18.0809C18.3669 18.0809 20.1047 16.3131 20.1301 16.1523C20.2047 16.1131 20.7743 15.255 20.8985 15.0146C22.1461 12.6008 22.4661 10.3453 21.9166 7.84173C21.8222 7.41076 21.5656 6.58163 21.4466 6.32185C21.0689 5.49771 20.7537 4.89376 20.6313 4.76037C20.5947 4.72037 20.5647 4.66757 20.5647 4.64278C20.5647 4.59598 20.0298 3.85984 19.7786 3.56086C19.6026 3.35128 18.8361 2.58634 18.6169 2.40135C18.2677 2.10678 17.796 1.7622 17.7418 1.7622C17.7102 1.7622 17.6842 1.7442 17.684 1.72221C17.6834 1.64421 16.7281 1.11045 16.1445 0.862071L15.7676 0.701884L11.6988 4.77137Z"
                            fill="#928EFE" />
                    </svg>
                </div>
                <span class="vault-brand">Passave</span>
            </div>
            <div class="vault-header-right">
                <button id="autofill-page-btn" class="icon-btn" title="Autofill current page">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                </button>
                <button id="logout-btn" class="icon-btn" title="Sign out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- User greeting + stats -->
        <div class="vault-hero">
            <div class="vault-greeting">
                <span class="greeting-text">Good <span id="greeting-time">day</span>,</span>
                <span class="greeting-name" id="user-greeting">Vault</span>
            </div>
            <div class="vault-stat-pill">
                <span id="vault-count">0</span> credentials
            </div>
        </div>

        <!-- Search -->
        <div class="search-wrap">
            <div class="search-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8" />
                    <path d="M21 21l-4.35-4.35" />
                </svg>
            </div>
            <input type="text" id="search-input" class="search-input" placeholder="Search credentials…">
            <div id="search-clear" class="search-clear" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </div>
        </div>

        <!-- Saves list -->
        <div id="saves-list" class="saves-list">
            <div class="loading-state">
                <div class="loading-dots"><span></span><span></span><span></span></div>
                <p>Decrypting vault…</p>
            </div>
        </div>

        <!-- Page match banner -->
        <div id="page-match-banner" class="page-match-banner" style="display:none">
            <div class="page-match-inner">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 8v4M12 16h.01" />
                </svg>
                <span id="page-match-text">Match found for this page</span>
            </div>
        </div>
    </div>

    <!-- CREDENTIAL DETAIL PANEL (slide-in) -->
    <div id="panel-detail" class="detail-panel">
        <div class="detail-header">
            <button id="detail-back" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 5l-7 7 7 7" />
                </svg>
            </button>
            <span class="detail-title">Credential</span>
            <div class="detail-logo-wrap">
                <img id="detail-logo" class="detail-logo" src="" alt="" style="display:none">
                <div id="detail-logo-fallback" class="detail-logo-fallback"></div>
            </div>
        </div>

        <div class="detail-body">
            <div class="detail-name-row">
                <h2 id="detail-name" class="detail-name"></h2>
                <span id="detail-category" class="detail-tag"></span>
            </div>

            <div id="detail-fields" class="detail-fields"></div>

            <div class="detail-actions">
                <button id="detail-autofill" class="btn-primary full">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                    Autofill on Page
                </button>
                <a id="detail-open-url" href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary full"
                    style="display:none">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" />
                        <polyline points="15 3 21 3 21 9" />
                        <line x1="10" y1="14" x2="21" y2="3" />
                    </svg>
                    Open Site
                </a>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast" style="display:none"></div>

    <script src="popup.js"></script>
</body>

</html>
